# Lab local imevts: imagem mayara-server:local (--emulator + --imevts-sim) na 6502
# + geo-echo-renderer na 6503 + UDP IMRS 6510 (FK-3.1 / RM-124).
# Subir: ../scripts/dev/up-local.sh
# FK-1 smoke: --emulator (cenário embutido HALO). IMRS: sim imevts → UDP 6510 → brand ImevtsSim.
# Config/share em named volumes (sobrevivem recreate/rebuild); tmpfs só em /tmp.
services:
  mayara-server:
    container_name: mayara-local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Host network during build: same IPv4 path as the host (avoids broken
      # container IPv6 → crates.io / GitHub timeouts).
      network: host
    image: mayara-server:local
    # --emulator HALO + --imevts-sim (UDP IMRS from imevts sim; both coexist).
    command: ["mayara-server", "--emulator", "--imevts-sim"]
    ports:
      - "${MAYARA_HOST_PORT:-6502}:6502"
      # FK-3.1 / RM-124: IMRS spoke datagrams from imevts sim (default host 6510/udp).
      - "${MAYARA_IMEVTS_SIM_HOST_PORT:-6510}:6510/udp"
    environment:
      GEO_ECHO_RENDERER_URL: http://geo-echo-renderer:6503
    networks:
      - mayara-lab
    volumes:
      - mayara-config:/home/mayara/.config/mayara
      - mayara-share:/home/mayara/.local/share/mayara
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  geo-echo-renderer:
    container_name: mayara-geo-echo-renderer
    image: mayara-server:local
    command: ["geo-echo-renderer"]
    ports:
      - "${MAYARA_GEO_ECHO_HOST_PORT:-6503}:6503"
    networks:
      - mayara-lab
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Override image HEALTHCHECK (signalk :6502) — this process only serves :6503.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6503/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  mayara-lab:
    driver: bridge

volumes:
  mayara-config:
  mayara-share:
